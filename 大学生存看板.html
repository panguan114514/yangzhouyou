<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大学生存看板</title>
<style>
/* SECTION: tokens */
:root{
  --paper:#f5f3ee;
  --card:#ffffff;
  --ink:#1e2a33;
  --ink-2:#556370;
  --ink-3:#8c979f;
  --line:#e7e2d8;
  --accent:#146b5f;
  --accent-2:#2f8f7f;
  --accent-soft:#e3f2ef;
  --danger:#bf4a38;
  --danger-soft:#fbeae6;
  --warn:#b57a1c;
  --warn-soft:#fbf1dd;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(30,42,51,.05), 0 14px 30px -22px rgba(30,42,51,.45);
  --cat-study:#3b6ea5;
  --cat-club:#a8557e;
  --cat-exam:#b5801f;
  --cat-life:#4f8a5b;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 8% -10%, #e9f2ef 0%, rgba(233,242,239,0) 60%),
    radial-gradient(760px 480px at 100% 0%, #f7ecdf 0%, rgba(247,236,223,0) 55%),
    var(--paper);
  min-height:100vh;
  line-height:1.5;
  font-size:15px;
}
button{ font:inherit; color:inherit; cursor:pointer; }
input,select{ font:inherit; color:inherit; }

/* SECTION: layout */
.page{
  width:100%;
  max-width:1120px;
  margin:0 auto;
  padding:clamp(14px,3vw,28px) clamp(12px,3vw,24px) 64px;
}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,300px);
  gap:clamp(12px,2vw,20px);
  align-items:start;
}
.col-main{ min-width:0; }
.col-side{ min-width:0; display:flex; flex-direction:column; gap:clamp(12px,2vw,16px); }
@media (max-width:860px){
  .layout{ grid-template-columns:minmax(0,1fr); }
}

/* SECTION: header */
.topbar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:clamp(14px,2.4vw,22px);
}
.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.logo{
  width:44px; height:44px; flex:0 0 44px;
  border-radius:14px;
  background:linear-gradient(145deg,var(--accent),#0d5a50);
  color:#fff; font-size:22px; font-weight:700;
  display:grid; place-items:center;
  box-shadow:0 10px 20px -12px rgba(20,107,95,.9);
}
.brand h1{ margin:0; font-size:clamp(18px,2.6vw,22px); letter-spacing:.01em; }
.sub{ margin:2px 0 0; font-size:13px; color:var(--ink-3); }
.topbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ghost-btn{
  display:inline-flex; align-items:center; gap:7px;
  min-height:40px; padding:0 14px;
  background:rgba(255,255,255,.75);
  border:1px solid var(--line);
  border-radius:999px;
  font-size:14px; color:var(--ink-2);
  transition:background .15s, border-color .15s, color .15s;
}
.ghost-btn:hover{ background:#fff; border-color:#d8d2c5; color:var(--ink); }
.badge{
  min-width:20px; padding:0 6px;
  height:20px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent);
  font-size:12px; font-weight:700;
  display:inline-grid; place-items:center;
}
.storage-warn{
  margin:0 0 16px; padding:10px 14px;
  border-radius:var(--radius-sm);
  background:var(--warn-soft); border:1px solid #eddcc0;
  color:#7d5512; font-size:13px;
}

/* SECTION: overview */
.overview{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:clamp(12px,2vw,16px);
  margin-bottom:clamp(12px,2vw,16px);
}
@media (max-width:760px){
  .overview{ grid-template-columns:minmax(0,1fr); }
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.ring-card{
  display:flex; align-items:center; gap:clamp(14px,2.4vw,22px);
  padding:clamp(16px,2.6vw,22px);
}
.ring-wrap{ position:relative; width:118px; height:118px; flex:0 0 118px; }
.ring{ width:118px; height:118px; display:block; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:#eceae3; stroke-width:11; }
.ring-fg{
  fill:none;
  stroke:url(#ringGrad);
  stroke:var(--accent-2);
  stroke-width:11;
  stroke-linecap:round;
  transition:stroke-dashoffset .5s ease, stroke .3s;
}
.ring-center{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; pointer-events:none;
}
.ring-center strong{ font-size:26px; letter-spacing:-.02em; }
.ring-center span{ font-size:11px; color:var(--ink-3); letter-spacing:.08em; }
.ring-side{ min-width:0; }
.ring-title{ margin:0 0 6px; font-size:14px; font-weight:700; color:var(--ink); }
.ring-desc{ margin:0; font-size:13.5px; color:var(--ink-2); }
.ring-desc em{ font-style:normal; font-weight:700; color:var(--accent); }
.ring-desc .over-txt{ color:var(--danger); font-weight:700; }

.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
@media (max-width:420px){
  .stats{ grid-template-columns:minmax(0,1fr); }
}
.stat{
  padding:14px 16px;
  border-radius:var(--radius);
  border:1px solid var(--line);
  background:var(--card);
  box-shadow:var(--shadow);
  text-align:left;
  display:flex; flex-direction:column; gap:4px;
  border-top:3px solid var(--line);
  transition:transform .15s, border-color .15s;
}
.stat:hover{ transform:translateY(-2px); }
.stat-label{ font-size:12.5px; color:var(--ink-3); }
.stat-value{ font-size:clamp(22px,3vw,28px); font-weight:700; letter-spacing:-.02em; line-height:1.1; }
.stat[data-kind="pending"]{ border-top-color:var(--accent-2); }
.stat[data-kind="done"]{ border-top-color:#9bb7a0; }
.stat[data-kind="overdue"]{ border-top-color:#e0a08f; }
.stat[data-kind="overdue"] .stat-value{ color:var(--danger); }
.stat[data-kind="overdue"].is-zero .stat-value{ color:var(--ink-2); }
.stat-hint{ font-size:11.5px; color:var(--ink-3); }

/* SECTION: composer */
.composer{ padding:clamp(14px,2.4vw,20px); margin-bottom:clamp(12px,2vw,16px); }
.composer-main{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.composer-main input[type="text"]{
  flex:1 1 220px; min-width:0;
  height:46px; padding:0 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--line);
  background:#fbfaf7;
  font-size:16px;
  transition:border-color .15s, background .15s, box-shadow .15s;
}
.composer-main input[type="text"]::placeholder{ color:#a9b1b7; }
.composer-main input[type="text"]:focus{
  outline:none; border-color:var(--accent-2); background:#fff;
  box-shadow:0 0 0 3px rgba(47,143,127,.14);
}
.primary-btn{
  flex:0 0 auto;
  min-height:46px; padding:0 22px;
  border:none; border-radius:var(--radius-sm);
  background:linear-gradient(160deg,var(--accent-2),var(--accent));
  color:#fff; font-weight:700; font-size:15px;
  box-shadow:0 12px 22px -14px rgba(20,107,95,.95);
  transition:transform .15s, filter .15s;
}
.primary-btn:hover{ filter:brightness(1.05); }
.primary-btn:active{ transform:translateY(1px); }
.composer-meta{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-top:12px;
}
.field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.field > span{ font-size:12px; color:var(--ink-3); padding-left:2px; }
.field input,.field select{
  width:100%; min-width:0;
  height:42px; padding:0 10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#fbfaf7;
  font-size:15px;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.field input:focus,.field select:focus{
  outline:none; border-color:var(--accent-2); background:#fff;
  box-shadow:0 0 0 3px rgba(47,143,127,.13);
}
.form-error{ margin:8px 0 0; font-size:13px; color:var(--danger); }

/* SECTION: filters */
.filters{ margin-bottom:clamp(12px,2vw,16px); }
.chip-row{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-bottom:10px;
}
.chip-btn{
  display:inline-flex; align-items:center; gap:7px;
  min-height:38px; padding:0 13px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.8);
  font-size:13.5px; color:var(--ink-2);
  transition:background .15s, border-color .15s, color .15s;
}
.chip-btn:hover{ background:#fff; color:var(--ink); }
.chip-btn .dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--ink-3); flex:0 0 8px;
}
.chip-btn[data-cat="study"] .dot{ background:var(--cat-study); }
.chip-btn[data-cat="club"] .dot{ background:var(--cat-club); }
.chip-btn[data-cat="exam"] .dot{ background:var(--cat-exam); }
.chip-btn[data-cat="life"] .dot{ background:var(--cat-life); }
.chip-btn .num{
  font-size:12px; font-weight:700; color:var(--ink-3);
  background:#f0eee8; border-radius:999px;
  min-width:20px; padding:1px 6px; text-align:center;
}
.chip-btn.is-active{
  background:var(--ink); border-color:var(--ink); color:#fff;
}
.chip-btn.is-active .num{ background:rgba(255,255,255,.18); color:#fff; }
.chip-btn.is-active .dot{ background:#fff; }

.filter-second{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
}
.segmented{
  display:inline-flex; padding:3px;
  background:#eceae3; border-radius:999px;
  gap:2px; max-width:100%;
}
.segmented button{
  border:none; background:transparent;
  min-height:34px; padding:0 13px;
  border-radius:999px;
  font-size:13.5px; color:var(--ink-2);
  white-space:nowrap;
  transition:background .15s, color .15s;
}
.segmented button:hover{ color:var(--ink); }
.segmented button.is-active{
  background:#fff; color:var(--ink); font-weight:700;
  box-shadow:0 1px 3px rgba(30,42,51,.12);
}
#search{
  flex:1 1 180px; min-width:0;
  height:40px; padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.85);
  font-size:15px;
}
#search:focus,#sort:focus{ outline:none; border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(47,143,127,.13); }
#sort{
  height:40px; padding:0 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.85);
  font-size:14px;
}

/* SECTION: task list */
.list-head{
  display:flex; align-items:baseline; gap:10px;
  margin:0 2px 10px;
  flex-wrap:wrap;
}
.list-head h2{ margin:0; font-size:15px; letter-spacing:.01em; }
.list-count{ font-size:12.5px; color:var(--ink-3); }
.task-list{ display:flex; flex-direction:column; gap:10px; }
.task{
  display:flex; gap:12px; align-items:flex-start;
  padding:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-left:4px solid #d9d4c8;
  border-radius:var(--radius-sm);
  box-shadow:0 1px 2px rgba(30,42,51,.04);
  transition:border-color .15s, transform .15s, opacity .2s;
}
.task:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
.task[data-priority="high"]{ border-left-color:#d4705c; }
.task[data-priority="medium"]{ border-left-color:#d9a84e; }
.task[data-priority="low"]{ border-left-color:#9fb6a6; }
.task.is-overdue{ background:linear-gradient(180deg,#fffdfc,#fff7f5); }
.task-check{
  flex:0 0 26px; width:26px; height:26px; min-height:26px;
  margin-top:1px; padding:0;
  border-radius:50%;
  border:2px solid #cfd6d3;
  background:#fff;
  color:#fff; font-size:14px; font-weight:700;
  display:grid; place-items:center;
  transition:background .15s, border-color .15s, transform .12s;
}
.task-check:hover{ border-color:var(--accent-2); transform:scale(1.06); }
.task.is-done .task-check{
  background:var(--accent-2); border-color:var(--accent-2);
}
.task-main{ flex:1 1 auto; min-width:0; }
.task-top{ display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; }
.task-title{
  margin:0; font-size:15px; font-weight:600; line-height:1.45;
  word-break:break-word; overflow-wrap:anywhere;
}
.task.is-done .task-title{ color:var(--ink-3); text-decoration:line-through; text-decoration-thickness:1.5px; }
.task-priority{
  flex:0 0 auto;
  font-size:11.5px; font-weight:700;
  padding:2px 7px; border-radius:6px;
  background:#f2f0ea; color:var(--ink-2);
}
.task-priority[data-priority="high"]{ background:#fbe6e1; color:#a8412c; }
.task-priority[data-priority="medium"]{ background:#fbf1dd; color:#8f6112; }
.task-priority[data-priority="low"]{ background:#e9f2ec; color:#3f6f4c; }
.task-note{
  margin:5px 0 0; font-size:13px; color:var(--ink-2);
  word-break:break-word; overflow-wrap:anywhere;
}
.task-meta{
  display:flex; flex-wrap:wrap; gap:6px 10px;
  margin-top:9px;
  font-size:12.5px; color:var(--ink-3);
}
.task-cat{
  font-size:12px; font-weight:600;
  padding:2px 8px; border-radius:6px;
  background:#eef2f6; color:var(--ink-2);
}
.task-cat[data-cat="study"]{ background:#e8f0f8; color:#2e5d8f; }
.task-cat[data-cat="club"]{ background:#f8ebf2; color:#8f3f68; }
.task-cat[data-cat="exam"]{ background:#fbf2df; color:#8a6114; }
.task-cat[data-cat="life"]{ background:#e9f3ec; color:#3f6f4c; }
.task-due{ font-weight:600; color:var(--ink-2); }
.task-due[data-tone="over"]{ color:var(--danger); }
.task-due[data-tone="soon"]{ color:var(--warn); }
.task-due[data-tone="done"]{ color:var(--ink-3); font-weight:500; }
.task-stamp{ color:var(--ink-3); }
.task-actions{ display:flex; gap:4px; flex:0 0 auto; }
.icon-btn{
  min-height:34px; padding:0 9px;
  border:none; border-radius:8px;
  background:transparent; color:var(--ink-3);
  font-size:13px;
  transition:background .15s, color .15s;
}
.icon-btn:hover{ background:#f2f0ea; color:var(--ink); }
.icon-btn.danger:hover{ background:var(--danger-soft); color:var(--danger); }
@media (max-width:560px){
  .task{ padding:12px; gap:10px; }
  .task-check{ flex-basis:30px; width:30px; height:30px; min-height:30px; }
  .task-actions{ flex-direction:column; }
  .icon-btn{ min-height:36px; min-width:44px; }
}
@media (max-width:400px){
  .task-actions{ flex-direction:row; }
}

/* SECTION: empty */
.empty{
  padding:34px 18px;
  text-align:center;
  border:1px dashed #dcd7c9;
  border-radius:var(--radius-sm);
  background:rgba(255,255,255,.55);
  color:var(--ink-3);
}
.empty strong{ display:block; font-size:15px; color:var(--ink-2); margin-bottom:5px; }
.empty p{ margin:0; font-size:13px; }

/* SECTION: sidebar */
.side-card{ padding:16px; }
.side-title{ margin:0 0 12px; font-size:13.5px; color:var(--ink-2); letter-spacing:.02em; }
.cat-progress{ display:flex; flex-direction:column; gap:12px; }
.cp-item{ min-width:0; }
.cp-top{ display:flex; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:5px; }
.cp-name{ color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cp-val{ color:var(--ink-3); font-size:12px; flex:0 0 auto; }
.cp-bar{ height:7px; border-radius:999px; background:#f0eee8; overflow:hidden; }
.cp-fill{ height:100%; border-radius:999px; background:var(--ink-3); transition:width .4s ease; }
.cp-item[data-cat="study"] .cp-fill{ background:var(--cat-study); }
.cp-item[data-cat="club"] .cp-fill{ background:var(--cat-club); }
.cp-item[data-cat="exam"] .cp-fill{ background:var(--cat-exam); }
.cp-item[data-cat="life"] .cp-fill{ background:var(--cat-life); }
.tip{ margin:0; font-size:13px; color:var(--ink-2); line-height:1.65; }

/* SECTION: modal */
.overlay{
  position:fixed; inset:0; z-index:60;
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  background:rgba(24,32,38,.42);
  backdrop-filter:blur(2px);
}
.overlay[hidden]{ display:none; }
.panel,.dialog{
  width:100%; max-width:520px;
  max-height:calc(100vh - 32px);
  display:flex; flex-direction:column;
  background:#fff; border-radius:var(--radius);
  box-shadow:0 30px 70px -30px rgba(15,25,32,.55);
  overflow:hidden;
}
.dialog{ max-width:400px; padding:22px; gap:10px; }
.dialog h2{ margin:0; font-size:17px; }
.dialog p{ margin:0; font-size:14px; color:var(--ink-2); line-height:1.6; }
.dialog-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; flex-wrap:wrap; }
.panel-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 18px; border-bottom:1px solid var(--line);
}
.panel-head h2{ margin:0; font-size:16px; }
.panel-head-actions{ display:flex; align-items:center; gap:6px; }
.icon-close{
  width:34px; height:34px; padding:0;
  border:none; border-radius:8px; background:transparent;
  font-size:22px; line-height:1; color:var(--ink-3);
}
.icon-close:hover{ background:#f2f0ea; color:var(--ink); }
.panel-body{ padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.panel-empty{ margin:0; padding:26px 18px 34px; text-align:center; color:var(--ink-3); font-size:13.5px; }
.panel-form{ padding:16px 18px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.panel-foot{
  display:flex; justify-content:flex-end; gap:8px;
  padding:12px 18px 16px; border-top:1px solid var(--line);
  flex-wrap:wrap;
}
.trash-item{
  display:flex; align-items:flex-start; gap:10px;
  padding:11px 12px;
  border:1px solid var(--line); border-radius:var(--radius-sm);
  background:#fbfaf7;
}
.trash-main{ flex:1 1 auto; min-width:0; }
.trash-title{ margin:0; font-size:14px; font-weight:600; word-break:break-word; overflow-wrap:anywhere; }
.trash-meta{ margin:4px 0 0; font-size:12px; color:var(--ink-3); }
.trash-actions{ display:flex; gap:4px; flex:0 0 auto; }
.danger-btn{
  min-height:38px; padding:0 16px;
  border:none; border-radius:10px;
  background:var(--danger); color:#fff; font-weight:600; font-size:14px;
}
.danger-btn:hover{ filter:brightness(1.06); }
.ghost-btn.solid{ background:#fff; }

/* SECTION: toast */
.toast{
  position:fixed; left:50%; bottom:22px; z-index:80;
  transform:translateX(-50%);
  display:flex; align-items:center; gap:14px;
  max-width:calc(100vw - 32px);
  padding:11px 14px 11px 16px;
  border-radius:999px;
  background:#22303a; color:#fff;
  font-size:13.5px;
  box-shadow:0 18px 36px -18px rgba(15,25,32,.8);
}
.toast[hidden]{ display:none; }
.toast span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toast button{
  flex:0 0 auto;
  border:none; border-radius:999px;
  padding:5px 12px;
  background:rgba(255,255,255,.16); color:#fff;
  font-weight:700; font-size:13px;
}
.toast button:hover{ background:rgba(255,255,255,.28); }
</style>
</head>
<body>
<div class="page">

  <!-- SECTION: header -->
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">✓</div>
      <div>
        <h1>大学生存看板</h1>
        <p class="sub" id="today-line">—</p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="ghost-btn" id="trash-open" type="button">
        回收站<span class="badge" id="trash-count">0</span>
      </button>
    </div>
  </header>
  <div class="storage-warn" id="storage-warn" hidden>当前浏览器禁用了本地存储，本次改动只保留在当前页面。</div>

  <!-- SECTION: overview -->
  <section class="overview">
    <div class="card ring-card">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="总完成率">
          <circle class="ring-bg" cx="60" cy="60" r="48"></circle>
          <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="48"></circle>
        </svg>
        <div class="ring-center">
          <strong id="ring-pct">0%</strong>
          <span>完成率</span>
        </div>
      </div>
      <div class="ring-side">
        <p class="ring-title">这一阵的进度</p>
        <p class="ring-desc" id="ring-desc">—</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat" data-kind="pending">
        <span class="stat-label">待办</span>
        <strong class="stat-value" id="stat-pending">0</strong>
        <span class="stat-hint">还没打卡的事</span>
      </div>
      <div class="stat" data-kind="done">
        <span class="stat-label">已完成</span>
        <strong class="stat-value" id="stat-done">0</strong>
        <span class="stat-hint">可以奖励自己了</span>
      </div>
      <div class="stat" data-kind="overdue" id="stat-overdue-card">
        <span class="stat-label">已逾期</span>
        <strong class="stat-value" id="stat-overdue">0</strong>
        <span class="stat-hint" id="stat-overdue-hint">暂时没有拖着的</span>
      </div>
    </div>
  </section>

  <!-- SECTION: composer -->
  <section class="card composer">
    <form id="task-form" autocomplete="off" novalidate>
      <div class="composer-main">
        <input id="f-title" type="text" maxlength="80" placeholder="要做什么？例如：交《数据结构》实验报告" aria-label="任务名称">
        <button class="primary-btn" type="submit">添加</button>
      </div>
      <div class="composer-meta">
        <label class="field"><span>分类</span><select id="f-cat"></select></label>
        <label class="field"><span>优先级</span><select id="f-priority"></select></label>
        <label class="field"><span>截止时间</span><input id="f-due" type="datetime-local"></label>
        <label class="field"><span>备注</span><input id="f-note" type="text" maxlength="60" placeholder="可选：地点、提交方式"></label>
      </div>
      <p class="form-error" id="form-error" hidden>先写个任务名称吧</p>
    </form>
  </section>

  <!-- SECTION: filters -->
  <section class="filters">
    <div class="chip-row" id="cat-chips"></div>
    <div class="filter-second">
      <div class="segmented" id="status-tabs" role="group" aria-label="状态筛选">
        <button type="button" data-status="all" class="is-active">全部</button>
        <button type="button" data-status="pending">待办</button>
        <button type="button" data-status="done">已完成</button>
        <button type="button" data-status="overdue">逾期</button>
      </div>
      <input id="search" type="search" placeholder="搜索任务或备注…" aria-label="搜索任务">
      <select id="sort" aria-label="排序方式">
        <option value="due">按截止时间</option>
        <option value="created">按创建时间</option>
        <option value="priority">按优先级</option>
      </select>
    </div>
  </section>

  <!-- SECTION: main grid -->
  <div class="layout">
    <main class="col-main">
      <div class="list-head">
        <h2 id="list-title">全部任务</h2>
        <span class="list-count" id="list-count"></span>
      </div>
      <div class="task-list" id="task-list"></div>
      <div class="empty" id="empty" hidden>
        <strong id="empty-title">这里还空着</strong>
        <p id="empty-desc">在上面输入框写一件要做的事，点「添加」就开始记了。</p>
      </div>
    </main>
    <aside class="col-side">
      <section class="card side-card">
        <h2 class="side-title">分类进度</h2>
        <div class="cat-progress" id="cat-progress"></div>
      </section>
      <section class="card side-card">
        <h2 class="side-title">防丢小提示</h2>
        <p class="tip">删除的任务会先进回收站，误删可以在下方提示条点「撤销」，也能随时去回收站找回。任务都存在这台电脑的浏览器里，刷新、关掉再打开都还在。</p>
      </section>
    </aside>
  </div>
</div>

<!-- SECTION: trash panel -->
<div class="overlay" id="trash-overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="trash-title">
    <div class="panel-head">
      <h2 id="trash-title">回收站</h2>

      <button class="icon-btn danger act-purge" type="button" data-action="purge">彻底删除</button>
    </div>
  </div>
</template>

<script>
(function(){
  'use strict';

  /* SECTION: constants */
  var STORE_KEY = 'campus-board-v1';
  var CATS = [
    { id: 'study', name: '课程DDL' },
    { id: 'club', name: '社团任务' },
    { id: 'exam', name: '四六级/考证' },
    { id: 'life', name: '生活杂事' }
  ];
  var PRIOS = [
    { id: 'high', name: '高', weight: 0 },
    { id: 'medium', name: '中', weight: 1 },
    { id: 'low', name: '低', weight: 2 }
  ];
  var DAY = 86400000;
  var RING_R = 48;
  var RING_C = 2 * Math.PI * RING_R;

  var state = {
    tasks: [],
    trash: [],
    filter: { cat: 'all', status: 'all', q: '', sort: 'due' },
    editingId: null,
    storageOK: true
  };
  var toastTimer = null;
  var confirmHandler = null;

  /* SECTION: dom */
  var el = {
    todayLine: document.getElementById('today-line'),
    storageWarn: document.getElementById('storage-warn'),
    ringFg: document.getElementById('ring-fg'),
    ringPct: document.getElementById('ring-pct'),
    ringDesc: document.getElementById('ring-desc'),
    statPending: document.getElementById('stat-pending'),
    statDone: document.getElementById('stat-done'),
    statOverdue: document.getElementById('stat-overdue'),
    statOverdueCard: document.getElementById('stat-overdue-card'),
    statOverdueHint: document.getElementById('stat-overdue-hint'),
    form: document.getElementById('task-form'),
    fTitle: document.getElementById('f-title'),
    fCat: document.getElementById('f-cat'),
    fPriority: document.getElementById('f-priority'),
    fDue: document.getElementById('f-due'),
    fNote: document.getElementById('f-note'),
    formError: document.getElementById('form-error'),
    catChips: document.getElementById('cat-chips'),
    statusTabs: document.getElementById('status-tabs'),
    search: document.getElementById('search'),
    sort: document.getElementById('sort'),
    listTitle: document.getElementById('list-title'),
    listCount: document.getElementById('list-count'),
    list: document.getElementById('task-list'),
    empty: document.getElementById('empty'),
    emptyTitle: document.getElementById('empty-title'),
    emptyDesc: document.getElementById('empty-desc'),
    catProgress: document.getElementById('cat-progress'),
    trashOpen: document.getElementById('trash-open'),
    trashCount: document.getElementById('trash-count'),
    trashOverlay: document.getElementById('trash-overlay'),
    trashList: document.getElementById('trash-list'),
    trashEmpty: document.getElementById('trash-empty'),
    trashClear: document.getElementById('trash-clear'),
    trashClose: document.getElementById('trash-close'),
    editOverlay: document.getElementById('edit-overlay'),
    editForm: document.getElementById('edit-form'),
    eTitle: document.getElementById('e-title'),
    eCat: document.getElementById('e-cat'),
    ePriority: document.getElementById('e-priority'),
    eDue: document.getElementById('e-due'),
    eNote: document.getElementById('e-note'),
    editError: document.getElementById('edit-error'),
    editClose: document.getElementById('edit-close'),
    editCancel: document.getElementById('edit-cancel'),
    confirmOverlay: document.getElementById('confirm-overlay'),
    confirmTitle: document.getElementById('confirm-title'),
    confirmMsg: document.getElementById('confirm-msg'),
    confirmOk: document.getElementById('confirm-ok'),
    confirmCancel: document.getElementById('confirm-cancel'),
    toast: document.getElementById('toast'),
    toastText: document.getElementById('toast-text'),
    toastAction: document.getElementById('toast-action'),
    tplTask: document.getElementById('tpl-task'),
    tplChip: document.getElementById('tpl-chip'),
    tplCatProg: document.getElementById('tpl-catprog'),
    tplTrash: document.getElementById('tpl-trash')
  };

  /* SECTION: utils */
  function pad(n){ return n < 10 ? '0' + n : String(n); }
  function uid(){
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function isoNow(){ return new Date().toISOString(); }
  function catName(id){
    for (var i = 0; i < CATS.length; i++) { if (CATS[i].id === id) return CATS[i].name; }
    return '其他';
  }
  function prioName(id){
    for (var i = 0; i < PRIOS.length; i++) { if (PRIOS[i].id === id) return PRIOS[i].name; }
    return '中';
  }
  function prioWeight(id){
    for (var i = 0; i < PRIOS.length; i++) { if (PRIOS[i].id === id) return PRIOS[i].weight; }
    return 1;
  }
  function fmtDT(value){
    var d = new Date(value);
    if (isNaN(d.getTime())) return '—';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtMD(value){
    var d = new Date(value);
    if (isNaN(d.getTime())) return '—';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtTodayLine(d){
    var w = ['日', '一', '二', '三', '四', '五', '六'];
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + w[d.getDay()];
  }
  function spanText(ms){
    var m = Math.floor(ms / 60000);
    if (m < 1) return '不到 1 分钟';
    if (m < 60) return m + ' 分钟';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分' : '');
    var d = Math.floor(h / 24);
    return d + ' 天' + (h % 24 ? ' ' + (h % 24) + ' 小时' : '');
  }
  function shorten(str){
    return str.length > 12 ? str.slice(0, 12) + '…' : str;
  }
  function toLocalInput(value){
    var d = new Date(value);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fromLocalInput(v){
    if (!v) return '';
    var d = new Date(v);
    return isNaN(d.getTime()) ? '' : d.toISOString();
  }

  /* SECTION: rules */
  function isOverdue(t){
    if (!t || t.done || !t.due) return false;
    var due = new Date(t.due);
    if (isNaN(due.getTime())) return false;
    return due.getTime() < Date.now();
  }
  function dueInfo(t){
    if (!t.due) return { label: '没设截止时间', tone: 'none' };
    var due = new Date(t.due);
    if (isNaN(due.getTime())) return { label: '没设截止时间', tone: 'none' };
    if (t.done) return { label: '截止 ' + fmtMD(t.due), tone: 'done' };
    var diff = due.getTime() - Date.now();
    if (diff < 0) return { label: '已逾期 ' + spanText(-diff), tone: 'over' };
    return { label: '还剩 ' + spanText(diff), tone: diff < DAY ? 'soon' : 'ok' };
  }
  function computeStats(){
    var total = state.tasks.length;
    var done = 0, overdue = 0;
    state.tasks.forEach(function(t){
      if (t.done) done++;
      else if (isOverdue(t)) overdue++;
    });
    return { total: total, done: done, pending: total - done, overdue: overdue };
  }

  /* SECTION: storage */
  function normalize(t){
    if (!t || typeof t.title !== 'string' || !t.title.trim()) return null;
    var catOK = false, prioOK = false;
    CATS.forEach(function(c){ if (c.id === t.category) catOK = true; });
    PRIOS.forEach(function(p){ if (p.id === t.priority) prioOK = true; });
    var due = (typeof t.due === 'string' && !isNaN(new Date(t.due).getTime())) ? t.due : '';
    var created = (typeof t.createdAt === 'string' && !isNaN(new Date(t.createdAt).getTime())) ? t.createdAt : isoNow();
    var completed = (typeof t.completedAt === 'string' && !isNaN(new Date(t.completedAt).getTime())) ? t.completedAt : null;
    var deleted = (typeof t.deletedAt === 'string' && !isNaN(new Date(t.deletedAt).getTime())) ? t.deletedAt : null;
    return {
      id: (typeof t.id === 'string' && t.id) ? t.id : uid(),
      title: String(t.title).slice(0, 120),
      category: catOK ? t.category : 'study',
      priority: prioOK ? t.priority : 'medium',
      due: due,
      note: typeof t.note === 'string' ? t.note.slice(0, 120) : '',
      done: !!t.done,
      createdAt: created,
      completedAt: completed,
      deletedAt: deleted
    };
  }
  function save(){
    if (!state.storageOK) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, tasks: state.tasks, trash: state.trash }));
    } catch (e) {
      state.storageOK = false;
      el.storageWarn.hidden = false;
    }
  }
  function load(){
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); }
    catch (e) { state.storageOK = false; el.storageWarn.hidden = false; }
    if (raw) {
      try {
        var data = JSON.parse(raw);
        var tasks = Array.isArray(data.tasks) ? data.tasks.map(normalize).filter(Boolean) : null;
        var trash = Array.isArray(data.trash) ? data.trash.map(normalize).filter(Boolean) : [];
        if (tasks) {
          state.tasks = tasks;
          state.trash = trash;
          return;
        }
      } catch (e2) { /* 数据损坏时回落到示例任务 */ }
    }
    seed();
    save();
  }
  function seed(){
    var now = Date.now();
    function mk(title, category, priority, dueOffset, note, done, doneAgoHours, createdAgoHours){
      return {
        id: uid(),
        title: title,
        category: category,
        priority: priority,
        due: dueOffset === null ? '' : new Date(now + dueOffset).toISOString(),
        note: note || '',
        done: !!done,
        createdAt: new Date(now - createdAgoHours * 3600000).toISOString(),
        completedAt: done ? new Date(now - doneAgoHours * 3600000).toISOString() : null,
        deletedAt: null
      };
    }
    state.tasks = [
      mk('交《数据结构》实验报告（第 4 章）', 'study', 'high', 2 * DAY + 6 * 3600000, '提交到教学平台，附运行截图', false, 0, 30),
      mk('背四级核心词汇 List 12', 'exam', 'medium', 8 * 3600000, '晚上睡前过一遍', false, 0, 26),
      mk('高数第 3 章习题（前 10 题）', 'study', 'medium', -1 * DAY, '课上讲的极限部分', false, 0, 52),
      mk('学生会例会：招新分工', 'club', 'medium', DAY + 6 * 3600000, '活动中心 302，带宣传计划', false, 0, 20),
      mk('宿舍水电费缴一下', 'life', 'low', 3 * DAY, '', false, 0, 14),
      mk('完成社团招新海报初稿', 'club', 'medium', DAY, '已发给部长看', true, 5, 40),
      mk('四六级报名信息核对', 'exam', 'high', -2 * DAY, '确认照片和证件号', true, 30, 60)
    ];
    state.trash = [];
  }

  /* SECTION: render helpers */
  function fillSelect(sel){
    sel.replaceChildren();
    CATS.forEach(function(c){
      var o = document.createElement('option');
      o.value = c.id;
      o.textContent = c.name;
      sel.appendChild(o);
    });
  }
  function fillPrioritySelect(sel){
    sel.replaceChildren();
    PRIOS.forEach(function(p){
      var o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.name + '优先';
      sel.appendChild(o);
    });
  }

  function paintOverview(){
    var s = computeStats();
    var pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    el.ringPct.textContent = pct + '%';
    el.ringFg.style.strokeDasharray = String(RING_C);
    el.ringFg.style.strokeDashoffset = String(RING_C * (1 - pct / 100));
    el.statPending.textContent = String(s.pending);
    el.statDone.textContent = String(s.done);
    el.statOverdue.textContent = String(s.overdue);
    el.statOverdueCard.classList.toggle('is-zero', s.overdue === 0);
    el.statOverdueHint.textContent = s.overdue ? '挑一件先做掉吧' : '暂时没有拖着的';

    el.ringDesc.replaceChildren();
    if (!s.total) {
      el.ringDesc.textContent = '还没有任务，先记下第一件要做的事。';
    } else {
      el.ringDesc.appendChild(document.createTextNode('共 ' + s.total + ' 项，已完成 '));
      var em = document.createElement('em');
      em.textContent = s.done + ' 项';
      el.ringDesc.appendChild(em);
      el.ringDesc.appendChild(document.createTextNode('，还有 ' + s.pending + ' 项在路上'));
      if (s.overdue) {
        el.ringDesc.appendChild(document.createTextNode('，其中 '));
        var ov = document.createElement('span');
        ov.className = 'over-txt';
        ov.textContent = s.overdue + ' 项已逾期';
        el.ringDesc.appendChild(ov);
      }
      el.ringDesc.appendChild(document.createTextNode('。'));
    }
  }

  function paintChips(){
    var frag = document.createDocumentFragment();
    var totalPending = state.tasks.filter(function(t){ return !t.done; }).length;
    var all = el.tplChip.content.firstElementChild.cloneNode(true);
    all.dataset.cat = 'all';
    all.querySelector('.dot').hidden = true;
    all.querySelector('.chip-name').textContent = '全部分类';
    all.querySelector('.num').textContent = String(totalPending);
    all.setAttribute('aria-label', '全部分类，待办 ' + totalPending + ' 项');
    all.classList.toggle('is-active', state.filter.cat === 'all');
    frag.appendChild(all);

    CATS.forEach(function(c){
      var item = el.tplChip.content.firstElementChild.cloneNode(true);
      var catTasks = state.tasks.filter(function(t){ return t.category === c.id; });
      var pending = catTasks.filter(function(t){ return !t.done; }).length;
      item.dataset.cat = c.id;
      item.querySelector('.chip-name').textContent = c.name;
      item.querySelector('.num').textContent = String(pending);
      item.title = c.name + '：共 ' + catTasks.length + ' 项，已完成 ' + (catTasks.length - pending) + ' 项';
      item.setAttribute('aria-label', c.name + '，待办 ' + pending + ' 项');
      item.classList.toggle('is-active', state.filter.cat === c.id);
      frag.appendChild(item);
    });
    el.catChips.replaceChildren(frag);
  }

  function paintCatProgress(){
    var frag = document.createDocumentFragment();
    CATS.forEach(function(c){
      var item = el.tplCatProg.content.firstElementChild.cloneNode(true);
      var catTasks = state.tasks.filter(function(t){ return t.category === c.id; });
      var done = catTasks.filter(function(t){ return t.done; }).length;
      var pct = catTasks.length ? Math.round(done / catTasks.length * 100) : 0;
      item.dataset.cat = c.id;
      item.querySelector('.cp-name').textContent = c.name;
      item.querySelector('.cp-val').textContent = catTasks.length ? (done + '/' + catTasks.length) : '暂无';
      item.querySelector('.cp-fill').style.width = pct + '%';
      frag.appendChild(item);
    });
    el.catProgress.replaceChildren(frag);
  }

  function buildCard(t){
    var node = el.tplTask.content.firstElementChild.cloneNode(true);
    node.dataset.id = t.id;
    node.dataset.priority = t.priority;
    if (t.done) node.classList.add('is-done');
    if (isOverdue(t)) node.classList.add('is-overdue');

    var check = node.querySelector('.task-check');
    check.dataset.action = 'toggle';
    check.dataset.id = t.id;
    check.setAttribute('aria-pressed', t.done ? 'true' : 'false');
    check.setAttribute('aria-label', t.done ? '标记为未完成' : '标记为已完成');
    check.textContent = t.done ? '✓' : '';

    node.querySelector('.task-title').textContent = t.title;

    var prio = node.querySelector('.task-priority');
    prio.dataset.priority = t.priority;
    prio.textContent = prioName(t.priority);

    var note = node.querySelector('.task-note');
    if (t.note) {
      note.textContent = t.note;
    } else {
      note.hidden = true;
    }

    var cat = node.querySelector('.task-cat');
    cat.dataset.cat = t.category;
    cat.textContent = catName(t.category);

    var due = node.querySelector('.task-due');
    var info = dueInfo(t);
    due.dataset.tone = info.tone;
    due.textContent = t.due ? (info.label + ' · 截止 ' + fmtMD(t.due)) : info.label;

    var created = node.querySelector('.stamp-created');
    created.textContent = '创建于 ' + fmtDT(t.createdAt);
    created.title = '创建时间：' + fmtDT(t.createdAt);

    var completed = node.querySelector('.stamp-completed');
    if (t.done && t.completedAt) {
      completed.textContent = '完成于 ' + fmtDT(t.completedAt);
      completed.title = '完成时间：' + fmtDT(t.completedAt);
    } else {
      completed.hidden = true;
    }

    node.querySelector('.act-edit').dataset.id = t.id;
    node.querySelector('.act-delete').dataset.id = t.id;
    return node;
  }

  function comparator(){
    var sort = state.filter.sort;
    return function(a, b){
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (sort === 'created') return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
      if (sort === 'priority') {
        var d = prioWeight(a.priority) - prioWeight(b.priority);
        if (d !== 0) return d;
      }
      return dueKey(a) - dueKey(b);
    };
  }
  function dueKey(t){
    if (!t.due) return Number.MAX_SAFE_INTEGER;
    var time = new Date(t.due).getTime();
    return isNaN(time) ? Number.MAX_SAFE_INTEGER : time;
  }

  function visibleTasks(){
    var f = state.filter;
    var q = f.q.trim().toLowerCase();
    var arr = state.tasks.filter(function(t){
      if (f.cat !== 'all' && t.category !== f.cat) return false;
      if (f.status === 'pending' && t.done) return false;
      if (f.status === 'done' && !t.done) return false;
      if (f.status === 'overdue' && !isOverdue(t)) return false;
      if (q) {
        var hay = (t.title + ' ' + t.note + ' ' + catName(t.category)).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    arr.sort(comparator());
    return arr;
  }

  function paintList(){
    var rows = visibleTasks();
    var frag = document.createDocumentFragment();
    rows.forEach(function(t){ frag.appendChild(buildCard(t)); });
    el.list.replaceChildren(frag);

    var statusNames = { all: '全部', pending: '待办', done: '已完成', overdue: '逾期' };
    var titleParts = [];
    titleParts.push(state.filter.cat === 'all' ? '全部任务' : catName(state.filter.cat));
    if (state.filter.status !== 'all') titleParts.push(statusNames[state.filter.status]);
    el.listTitle.textContent = titleParts.join(' · ');
    el.listCount.textContent = '显示 ' + rows.length + ' / ' + state.tasks.length + ' 项';

    var hasAny = state.tasks.length > 0;
    el.empty.hidden = rows.length > 0;
    el.list.hidden = rows.length === 0;
    if (rows.length === 0) {
      if (!hasAny) {
        el.emptyTitle.textContent = '这里还空着';
        el.emptyDesc.textContent = '在上面输入框写一件要做的事，点「添加」就开始记了。';
      } else {
        el.emptyTitle.textContent = '没有符合条件的任务';
        el.emptyDesc.textContent = '换个分类或状态试试，也可以清空搜索词。';
      }
    }
  }

  function paintTrashBadge(){
    el.trashCount.textContent = String(state.trash.length);
  }

  function paintTrashList(){
    var frag = document.createDocumentFragment();
    state.trash.forEach(function(t){
      var item = el.tplTrash.content.firstElementChild.cloneNode(true);
      item.dataset.id = t.id;
      item.querySelector('.trash-title').textContent = t.title;
      item.querySelector('.trash-meta').textContent =
        catName(t.category) + ' · 删除于 ' + fmtDT(t.deletedAt || t.createdAt);
      var restore = item.querySelector('.act-restore');
      restore.dataset.id = t.id;
      var purge = item.querySelector('.act-purge');
      purge.dataset.id = t.id;
      frag.appendChild(item);
    });
    el.trashList.replaceChildren(frag);
    el.trashEmpty.hidden = state.trash.length > 0;
    el.trashList.hidden = state.trash.length === 0;
  }

  function renderAll(){
    paintOverview();
    paintChips();
    paintList();
    paintCatProgress();
    paintTrashBadge();
    paintTrashList();
  }

  function refreshLive(){
    paintOverview();
    var nodes = el.list.querySelectorAll('.task');
    for (var i = 0; i < nodes.length; i++) {
      var id = nodes[i].dataset.id;
      var t = null;
      for (var j = 0; j < state.tasks.length; j++) {
        if (state.tasks[j].id === id) { t = state.tasks[j]; break; }
      }
      if (!t) continue;
      var info = dueInfo(t);
      var due = nodes[i].querySelector('.task-due');
      due.dataset.tone = info.tone;
      due.textContent = t.due ? (info.label + ' · 截止 ' + fmtMD(t.due)) : info.label;
      nodes[i].classList.toggle('is-overdue', isOverdue(t));
    }
    if (state.filter.status === 'overdue') paintList();
  }

  /* SECTION: toast */
  function showToast(msg, actionText, onAction){
    el.toastText.textContent = msg;
    if (actionText && onAction) {
      el.toastAction.hidden = false;
      el.toastAction.textContent = actionText;
      el.toastAction.onclick = function(){
        hideToast();
        onAction();
      };
    } else {
      el.toastAction.hidden = true;
      el.toastAction.onclick = null;
    }
    el.toast.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, actionText ? 7000 : 2600);
  }
  function hideToast(){
    el.toast.hidden = true;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  }

  /* SECTION: overlays */
  function openOverlay(node){
    node.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeOverlay(node){
    node.hidden = true;
    if (el.trashOverlay.hidden && el.editOverlay.hidden && el.confirmOverlay.hidden) {
      document.body.style.overflow = '';
    }
  }
  function askConfirm(title, msg, okText, handler){
    el.confirmTitle.textContent = title;
    el.confirmMsg.textContent = msg;
    el.confirmOk.textContent = okText || '确定';
    confirmHandler = handler;
    openOverlay(el.confirmOverlay);
  }

  /* SECTION: actions */
  function addTask(ev){
    ev.preventDefault();
    var title = el.fTitle.value.trim();
    if (!title) {
      el.formError.hidden = false;
      el.fTitle.focus();
      return;
    }
    el.formError.hidden = true;
    var task = {
      id: uid(),
      title: title.slice(0, 80),
      category: el.fCat.value,
      priority: el.fPriority.value,
      due: fromLocalInput(el.fDue.value),
      note: el.fNote.value.trim().slice(0, 60),
      done: false,
      createdAt: isoNow(),
      completedAt: null,
      deletedAt: null
    };
    state.tasks.push(task);
    save();
    el.fTitle.value = '';
    el.fNote.value = '';
    el.fDue.value = '';
    if (state.filter.status === 'done') {
      state.filter.status = 'all';
      syncStatusTabs();
    }
    renderAll();
    showToast('已添加：' + shorten(task.title));
    el.fTitle.focus();
  }

  function toggleTask(id){
    var t = null;
    for (var i = 0; i < state.tasks.length; i++) { if (state.tasks[i].id === id) { t = state.tasks[i]; break; } }
    if (!t) return;
    t.done = !t.done;
    t.completedAt = t.done ? isoNow() : null;
    save();
    renderAll();
    if (t.done) {
      var s = computeStats();
      showToast(s.pending ? ('已完成「' + shorten(t.title) + '」，还剩 ' + s.pending + ' 项') : '全部搞定，可以休息一下了');
    } else {
      showToast('已改回待办：' + shorten(t.title));
    }
  }

  function deleteTask(id){
    var idx = -1;
    for (var i = 0; i < state.tasks.length; i++) { if (state.tasks[i].id === id) { idx = i; break; } }
    if (idx === -1) return;
    var task = state.tasks.splice(idx, 1)[0];
    task.deletedAt = isoNow();
    state.trash.unshift(task);
    save();
    renderAll();
    showToast('已移到回收站：' + shorten(task.title), '撤销', function(){ restoreTask(id); });
  }

  function restoreTask(id){
    var idx = -1;
    for (var i = 0; i < state.trash.length; i++) { if (state.trash[i].id === id) { idx = i; break; } }
    if (idx === -1) return;
    var task = state.trash.splice(idx, 1)[0];
    task.deletedAt = null;
    state.tasks.push(task);
    save();
    renderAll();
    showToast('已恢复：' + shorten(task.title));
  }

  function purgeTask(id){
    var target = null;
    for (var i = 0; i < state.trash.length; i++) { if (state.trash[i].id === id) { target = state.trash[i]; break; } }
    if (!target) return;
    askConfirm('彻底删除？', '「' + target.title + '」会被永久删除，无法恢复。', '永久删除', function(){
      state.trash = state.trash.filter(function(t){ return t.id !== id; });
      save();
      renderAll();
      showToast('已永久删除');
    });
  }

  function clearTrash(){
    if (!state.trash.length) return;
    askConfirm('清空回收站？', '回收站里的 ' + state.trash.length + ' 项任务会被永久删除，无法恢复。', '全部删除', function(){
      state.trash = [];
      save();
      renderAll();
      showToast('回收站已清空');
    });
  }

  function openEdit(id){
    var t = null;
    for (var i = 0; i < state.tasks.length; i++) { if (state.tasks[i].id === id) { t = state.tasks[i]; break; } }
    if (!t) return;
    state.editingId = id;
    el.eTitle.value = t.title;
    el.eCat.value = t.category;
    el.ePriority.value = t.priority;
    el.eDue.value = t.due ? toLocalInput(t.due) : '';
    el.eNote.value = t.note || '';
    el.editError.hidden = true;
    openOverlay(el.editOverlay);
    el.eTitle.focus();
  }

  function saveEdit(ev){
    ev.preventDefault();
    var title = el.eTitle.value.trim();
    if (!title) {
      el.editError.hidden = false;
      el.eTitle.focus();
      return;
    }
    var t = null;
    for (var i = 0; i < state.tasks.length; i++) { if (state.tasks[i].id === state.editingId) { t = state.tasks[i]; break; } }
    if (!t) { closeOverlay(el.editOverlay); return; }
    t.title = title.slice(0, 80);
    t.category = el.eCat.value;
    t.priority = el.ePriority.value;
    t.due = fromLocalInput(el.eDue.value);
    t.note = el.eNote.value.trim().slice(0, 60);
    save();
    closeOverlay(el.editOverlay);
    renderAll();
    showToast('已保存修改');
  }

  function syncStatusTabs(){
    var btns = el.statusTabs.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('is-active', btns[i].dataset.status === state.filter.status);
    }
  }

  /* SECTION: events */
  el.form.addEventListener('submit', addTask);

  el.fTitle.addEventListener('input', function(){
    if (el.fTitle.value.trim()) el.formError.hidden = true;
  });

  el.list.addEventListener('click', function(ev){
    var btn = ev.target.closest('[data-action]');
    if (!btn) return;
    var id = btn.dataset.id;
    var action = btn.dataset.action;
    if (action === 'toggle') toggleTask(id);
    else if (action === 'edit') openEdit(id);
    else if (action === 'delete') deleteTask(id);
  });

  el.catChips.addEventListener('click', function(ev){
    var btn = ev.target.closest('.chip-btn');
    if (!btn) return;
    state.filter.cat = btn.dataset.cat || 'all';
    paintChips();
    paintList();
  });

  el.statusTabs.addEventListener('click', function(ev){
    var btn = ev.target.closest('button');
    if (!btn) return;
    state.filter.status = btn.dataset.status;
    syncStatusTabs();
    paintList();
  });

  el.search.addEventListener('input', function(){
    state.filter.q = el.search.value;
    paintList();
  });

  el.sort.addEventListener('change', function(){
    state.filter.sort = el.sort.value;
    paintList();
  });

  el.trashOpen.addEventListener('click', function(){
    paintTrashList();
    openOverlay(el.trashOverlay);
  });
  el.trashClose.addEventListener('click', function(){ closeOverlay(el.trashOverlay); });
  el.trashClear.addEventListener('click', clearTrash);
  el.trashOverlay.addEventListener('click', function(ev){
    if (ev.target === el.trashOverlay) closeOverlay(el.trashOverlay);
  });
  el.trashList.addEventListener('click', function(ev){
    var btn = ev.target.closest('[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'restore') restoreTask(btn.dataset.id);
    else if (btn.dataset.action === 'purge') purgeTask(btn.dataset.id);
  });

  el.editForm.addEventListener('submit', saveEdit);
  el.editClose.addEventListener('click', function(){ closeOverlay(el.editOverlay); });
  el.editCancel.addEventListener('click', function(){ closeOverlay(el.editOverlay); });
  el.editOverlay.addEventListener('click', function(ev){
    if (ev.target === el.editOverlay) closeOverlay(el.editOverlay);
  });

  el.confirmCancel.addEventListener('click', function(){
    confirmHandler = null;
    closeOverlay(el.confirmOverlay);
  });
  el.confirmOk.addEventListener('click', function(){
    var fn = confirmHandler;
    confirmHandler = null;
    closeOverlay(el.confirmOverlay);
    if (fn) fn();
  });
  el.confirmOverlay.addEventListener('click', function(ev){
    if (ev.target === el.confirmOverlay) {
      confirmHandler = null;
      closeOverlay(el.confirmOverlay);
    }
  });

  document.addEventListener('keydown', function(ev){
    if (ev.key !== 'Escape') return;
    if (!el.confirmOverlay.hidden) { confirmHandler = null; closeOverlay(el.confirmOverlay); }
    else if (!el.editOverlay.hidden) closeOverlay(el.editOverlay);
    else if (!el.trashOverlay.hidden) closeOverlay(el.trashOverlay);
  });

  /* SECTION: boot */
  fillSelect(el.fCat);
  fillPrioritySelect(el.fPriority);
  fillSelect(el.eCat);
  fillPrioritySelect(el.ePriority);
  el.todayLine.textContent = fmtTodayLine(new Date());
  load();
  renderAll();
  setInterval(refreshLive, 30000);
})();
</script>
</body>
</html>
